services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en .env}"
    ports:
      - "127.0.0.1:1433:1433"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: SqlServer
      ConnectionStrings__SqlServerCnn: "Server=db,1433;Database=CompeTournamentDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en .env};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Tokens__Key: "${TOKENS_KEY:?Defina TOKENS_KEY en .env}"
      Tokens__Issuer: CompeTournament
      Tokens__Audience: CompeTournamentUsers
      Seed__DefaultPassword: "${SEED_DEFAULT_PASSWORD:?Defina SEED_DEFAULT_PASSWORD en .env}"
    ports:
      - "8080:8080"
